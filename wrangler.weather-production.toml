name = "wetbulb35-weather-production"
main = "workers/hono-page-renderer.mjs"
compatibility_date = "2026-09-08"
workers_dev = false
preview_urls = true

# Route-free production candidate. Deployment still requires explicit approval.
[assets]
directory = "worker-assets"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "WEATHER_GATE", class_name = "WeatherGate" }]

[[migrations]]
tag = "v1-weather-gate"
new_sqlite_classes = ["WeatherGate"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true

[vars]
CANONICAL_ORIGIN = "https://www.wetbulb35.com"
GOOGLE_ANALYTICS_ID = "G-LNPWV0JL7S"
WEATHER_FRESH_SECONDS = "300"
WEATHER_STALE_SECONDS = "600"
WEATHER_TIMEOUT_MS = "5000"
WEATHER_DAILY_ATTEMPT_LIMIT = "100"
HTML_CACHE_EVENT_SAMPLE_RATE = "0"
