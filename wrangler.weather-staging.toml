name = "wetbulb35-weather-staging"
main = "workers/hono-page-renderer.mjs"
compatibility_date = "2026-09-08"

# Isolated workers.dev staging candidate only. No production route, DNS, or custom domain.
# The encrypted staging secret is managed outside this file; deployment is explicit.
[assets]
directory = "worker-assets"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "WEATHER_GATE", class_name = "WeatherGate" }]

[[migrations]]
tag = "v1-weather-gate"
new_sqlite_classes = ["WeatherGate"]

[version_metadata]
binding = "CF_VERSION_METADATA"

# Wrangler 4.129.1 schema supports this isolated Worker Logs configuration.
# Request URLs retain no query strings; application events are fixed-field JSON.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true

[vars]
CANONICAL_ORIGIN = "https://www.wetbulb35.com"
GOOGLE_ANALYTICS_ID = "G-LNPWV0JL7S"
WEATHER_FRESH_SECONDS = "300"
WEATHER_STALE_SECONDS = "600"
WEATHER_TIMEOUT_MS = "5000"
# Matches the OpenWeather subscription cap (2,000 calls/day); attempts are reserved before provider fetches.
WEATHER_DAILY_ATTEMPT_LIMIT = "2000"
# Disabled by default; enable only as a reviewed [0,1] staging fraction.
HTML_CACHE_EVENT_SAMPLE_RATE = "0"
