name = "wetbulb35-apex-redirect"
main = "workers/apex-redirect.mjs"
compatibility_date = "2026-09-27"
workers_dev = false
preview_urls = false

# The apex is an exact Worker custom domain and redirects to the canonical www host.
routes = [{ pattern = "wetbulb35.com", custom_domain = true }]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true
