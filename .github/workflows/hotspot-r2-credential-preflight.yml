name: Hotspot R2 hosted credential preflight (read-only)

# Manual only. This workflow is not present on the default branch until an
# authorized merge; invoking it never downloads weather data or publishes.
on:
  # Disposable, branch-only hosted permission test; never reads/writes production aliases.
  push:
    branches:
      - test/hosted-r2-preflight-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.WETBULB35_CLOUDFLARE_API_TOKEN }}
      HOTSPOT_R2_BUCKET: ${{ vars.HOTSPOT_R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify hosted token can read the exact private bucket metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$HOTSPOT_R2_BUCKET" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          result=$(mktemp "$RUNNER_TEMP/hotspot-r2-preflight.XXXXXX")
          trap 'rm -f "$result"' EXIT
          curl --fail-with-body --silent --show-error --max-time 15 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$HOTSPOT_R2_BUCKET" > "$result"
          python3 - "$result" "$HOTSPOT_R2_BUCKET" <<'PY'
          import json
          import sys
          from pathlib import Path
          response = json.loads(Path(sys.argv[1]).read_text())
          if response.get('success') is not True or response.get('result', {}).get('name') != sys.argv[2]:
              raise SystemExit('Hosted R2 metadata did not identify the configured bucket')
          print('Hosted token read the expected R2 bucket metadata; object read/write permission remains unverified.')
          PY
      - name: Verify isolated hosted R2 put, readback, delete, and absence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          key="rehearsals/hosted-credential-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/probe.txt"
          object="$HOTSPOT_R2_BUCKET/$key"
          source=$(mktemp "$RUNNER_TEMP/hosted-r2-source.XXXXXX")
          readback=$(mktemp "$RUNNER_TEMP/hosted-r2-readback.XXXXXX")
          missing=$(mktemp "$RUNNER_TEMP/hosted-r2-missing.XXXXXX")
          created=false
          cleanup() {
            if [[ "$created" == true ]]; then
              ./node_modules/.bin/wrangler r2 object delete "$object" --remote --force >/dev/null || true
            fi
            rm -f "$source" "$readback" "$missing"
          }
          trap cleanup EXIT
          printf 'isolated hosted R2 permission probe\n' > "$source"
          ./node_modules/.bin/wrangler r2 object put "$object" --file "$source" --remote >/dev/null
          created=true
          ./node_modules/.bin/wrangler r2 object get "$object" --file "$readback" --remote >/dev/null
          cmp "$source" "$readback"
          ./node_modules/.bin/wrangler r2 object delete "$object" --remote --force >/dev/null
          if ./node_modules/.bin/wrangler r2 object get "$object" --file "$readback" --remote >"$missing" 2>&1; then
            echo 'Test object still exists after deletion' >&2
            exit 1
          fi
          if ! grep -qiE 'does not exist|NoSuchKey|not found|404' "$missing"; then
            echo 'Could not verify test object absence' >&2
            exit 1
          fi
          created=false
          echo 'Hosted R2 test object write/readback/delete verified; no production alias touched.'
