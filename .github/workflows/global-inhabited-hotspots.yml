name: Global wet bulb hotspots

on:
  schedule:
    # One run per IFS cycle (18/00/06/12Z), starting 6h35 after initialization so bounded
    # readiness polling begins before ECMWF's documented 7–9 hour dissemination delay ends.
    - cron: "35 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated snapshot to the configured R2 bucket"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: global-inhabited-hotspots
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_HOTSPOTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PUBLISH_INTENDED: ${{ github.event_name == 'schedule' || inputs.publish }}
      # Per run; four cycles a day cap scheduled public-endpoint demand at 4 × (2,000 + 50 pinned five-day) weighted calls.
      HOTSPOT_RUN_LOCATION_LIMIT: ${{ vars.HOTSPOT_RUN_LOCATION_LIMIT || '2000' }}
      HOTSPOT_EXCLUDED_SAMPLE_SIZE: ${{ vars.HOTSPOT_EXCLUDED_SAMPLE_SIZE || '100' }}
      # At batch-size 100, 20 seconds caps public-endpoint demand at
      # 300 location-equivalents/minute before retries and backoff.
      HOTSPOT_INTER_BATCH_DELAY_MS: ${{ vars.HOTSPOT_INTER_BATCH_DELAY_MS || '20000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned hotspot dependencies
        run: |
          python -m venv .venv-hotspots
          .venv-hotspots/bin/python -m pip install --require-hashes -r requirements/global-hotspots.txt

      - name: Verify focused hotspot implementation
        run: |
          npm run test:global-hotspots
          .venv-hotspots/bin/python -m unittest tests/test_await_ifs_run_readiness.py tests/test_generate_ecmwf_hotspot_candidates.py tests/test_download_ecmwf_hotspot_grid.py tests/test_download_gfs_hotspot_grid.py tests/test_generate_global_grid_hotspot_snapshot.py tests/test_compare_hotspot_shadow_snapshots.py tests/test_capture_hotspot_shadow_stations.py tests/test_score_hotspot_shadow_observations.py

      - name: Build the canonical city manifest
        run: npm run build:hotspot-city-manifest

      - name: Read the currently published snapshots
        id: current
        if: env.PUBLISH_INTENDED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WETBULB35_CLOUDFLARE_API_TOKEN }}
          HOTSPOT_R2_BUCKET: ${{ vars.HOTSPOT_R2_BUCKET }}
        run: |
          test -n "$HOTSPOT_R2_BUCKET"
          mkdir -p .hotspots
          read_current() {
            local key="$1" target="$2" log
            log=$(mktemp)
            if npx wrangler r2 object get "$HOTSPOT_R2_BUCKET/$key" --file="$target" --remote >"$log" 2>&1; then return 0; fi
            rm -f "$target"
            # Only a missing object means nothing is published; any other failure must not let an older run through.
            if grep -qiE "does not exist|NoSuchKey|not found|404" "$log"; then return 0; fi
            cat "$log" >&2
            return 1
          }
          read_current inhabited-hotspots/v1/latest.json .hotspots/current-inhabited.json
          read_current global-grid-hotspots/v1/latest.json .hotspots/current-global-grid.json
          # Poll only for cycles newer than the older of the two published products.
          node --input-type=module -e "
            import fs from 'node:fs';
            import { snapshotRun } from './scripts/hotspot-publish-guard.mjs';
            const read = (file) => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
            const runs = [snapshotRun('inhabited', read('.hotspots/current-inhabited.json')), snapshotRun('global-grid', read('.hotspots/current-global-grid.json'))];
            const value = runs.every(Boolean) ? new Date(Math.min(...runs.map((run) => run.initialization))).toISOString().replace('.000Z', 'Z') : '';
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'initialization=' + value + '\n');
          "

      - name: Wait for the newest usable IFS cycle
        id: readiness
        run: |
          # Bounded: stop well inside the job timeout; the next cycle's schedule retries.
          DEADLINE=$(date -u -d "+285 minutes" +%Y-%m-%dT%H:%M:%SZ)
          PUBLISHED="${{ steps.current.outputs.initialization }}"
          set +e
          .venv-hotspots/bin/python scripts/await-ifs-run-readiness.py \
            --source azure \
            --deadline "$DEADLINE" \
            ${PUBLISHED:+--published-initialization "$PUBLISHED"} \
            --output .hotspots/readiness.json
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 3 ]; then
            echo "::warning::No newer complete IFS cycle with matching Open-Meteo data was usable before $DEADLINE; the prior snapshot is retained."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            exit "$STATUS"
          fi

      - name: Download the selected complete public ECMWF run
        if: steps.readiness.outputs.ready == 'true'
        run: |
          .venv-hotspots/bin/python scripts/download-ecmwf-hotspot-grid.py \
            --readiness .hotspots/readiness.json \
            --source azure \
            --forecast-output .hotspots/ecmwf-forecast.grib2 \
            --land-mask-output .hotspots/ecmwf-land-mask.grib2 \
            --metadata-output .hotspots/ecmwf-download.json

      - name: Discover candidate cities on the native model grid
        if: steps.readiness.outputs.ready == 'true'
        run: |
          STEPS=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.steps.join(','))")
          WINDOW_START=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.windowStart)")
          WINDOW_END=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.windowEnd)")
          .venv-hotspots/bin/python scripts/generate-ecmwf-hotspot-candidates.py \
            --forecast-grib .hotspots/ecmwf-forecast.grib2 \
            --land-mask-grib .hotspots/ecmwf-land-mask.grib2 \
            --cities .hotspots/cities.json \
            --output .hotspots/candidates.json \
            --steps "$STEPS" \
            --window-start "$WINDOW_START" \
            --window-end "$WINDOW_END" \
            --margin-c 1.5 \
            --threshold-c 27.0 \
            --dilation-rings 1

      - name: Refine every candidate hourly and validate the snapshot
        if: steps.readiness.outputs.ready == 'true'
        env:
          OPEN_METEO_API_MODE: ${{ vars.OPEN_METEO_API_MODE || 'public-noncommercial' }}
          OPEN_METEO_BASE_URL: ${{ vars.OPEN_METEO_BASE_URL }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: |
          npm run generate:hotspot-snapshot -- \
            --candidates .hotspots/candidates.json \
            --city-manifest .hotspots/cities.json \
            --output .hotspots/snapshot.json \
            --download-metadata .hotspots/ecmwf-download.json \
            --pinned-five-day true \
            --batch-size 100

      - name: Rank every global model-grid cell from the same initialization
        if: steps.readiness.outputs.ready == 'true'
        run: |
          STEPS=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.steps.join(','))")
          WINDOW_START=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.windowStart)")
          WINDOW_END=$(node -e "const m=require('./.hotspots/ecmwf-download.json'); process.stdout.write(m.windowEnd)")
          .venv-hotspots/bin/python scripts/generate-global-grid-hotspot-snapshot.py \
            --forecast-grib .hotspots/ecmwf-forecast.grib2 \
            --output .hotspots/global-grid-snapshot.json \
            --download-metadata .hotspots/ecmwf-download.json \
            --steps "$STEPS" \
            --window-start "$WINDOW_START" \
            --window-end "$WINDOW_END"

      - name: Verify both products use the polled initialization and window
        if: steps.readiness.outputs.ready == 'true'
        run: |
          .venv-hotspots/bin/python - <<'PY'
          import json
          from pathlib import Path

          readiness = json.loads(Path('.hotspots/readiness.json').read_text())
          download = json.loads(Path('.hotspots/ecmwf-download.json').read_text())
          inhabited = json.loads(Path('.hotspots/snapshot.json').read_text())
          global_grid = json.loads(Path('.hotspots/global-grid-snapshot.json').read_text())
          initializations = {
              readiness['initialization'],
              download['initialization'],
              inhabited['discovery']['initialization'],
              global_grid['model']['initialization'],
          }
          if len(initializations) != 1:
              raise SystemExit(f'Hotspot products have mismatched initializations: {sorted(initializations)}')
          if any(day.get('fiveDay', {}).get('initialization', readiness['initialization']) != readiness['initialization'] for day in inhabited['hotspots']):
              raise SystemExit('Pinned five-day data does not use the snapshot initialization')
          if inhabited['validFrom'] != download['windowStart'] or inhabited['validTo'] != download['validTo']:
              raise SystemExit('Inhabited snapshot does not match the publication-relative 24-hour window')
          if global_grid['model']['validTimeBounds'] != {'start': download['windowStart'], 'end': download['windowEnd']}:
              raise SystemExit('Global-grid snapshot does not match the publication-relative 24-hour window')
          PY

      - name: Retain the validated snapshot as a workflow artifact
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: global-hotspots-${{ github.run_id }}
          path: |
            .hotspots/snapshot.json
            .hotspots/global-grid-snapshot.json
            .hotspots/ecmwf-download.json
            .hotspots/readiness.json
          if-no-files-found: error
          retention-days: 14

      - name: Guard the latest pointers against older or duplicate runs
        id: guard
        if: steps.readiness.outputs.ready == 'true' && env.PUBLISH_INTENDED == 'true'
        run: |
          INHABITED=$(GITHUB_OUTPUT= node scripts/hotspot-publish-guard.mjs --kind inhabited --candidate .hotspots/snapshot.json --current .hotspots/current-inhabited.json)
          GLOBAL_GRID=$(GITHUB_OUTPUT= node scripts/hotspot-publish-guard.mjs --kind global-grid --candidate .hotspots/global-grid-snapshot.json --current .hotspots/current-global-grid.json)
          echo "$INHABITED"
          echo "$GLOBAL_GRID"
          echo "inhabited=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).publish))" "$INHABITED")" >> "$GITHUB_OUTPUT"
          echo "global_grid=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).publish))" "$GLOBAL_GRID")" >> "$GITHUB_OUTPUT"

      - name: Publish content-addressed and current R2 objects
        if: steps.guard.outputs.inhabited == 'true' || steps.guard.outputs.global_grid == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WETBULB35_CLOUDFLARE_API_TOKEN }}
          HOTSPOT_R2_BUCKET: ${{ vars.HOTSPOT_R2_BUCKET }}
          PUBLISH_INHABITED: ${{ steps.guard.outputs.inhabited }}
          PUBLISH_GLOBAL_GRID: ${{ steps.guard.outputs.global_grid }}
        run: |
          test -n "$HOTSPOT_R2_BUCKET"
          publish() {
            local source="$1" prefix="$2" name="$3"
            local digest immutable
            digest=$(sha256sum "$source" | cut -d' ' -f1)
            immutable="$prefix/v1/snapshots/sha256-${digest}.json"
            npx wrangler r2 object put "$HOTSPOT_R2_BUCKET/$immutable" --file="$source" --remote
            npx wrangler r2 object get "$HOTSPOT_R2_BUCKET/$immutable" --file=".hotspots/verify-$name-immutable.json" --remote
            cmp "$source" ".hotspots/verify-$name-immutable.json"
            npx wrangler r2 object put "$HOTSPOT_R2_BUCKET/$prefix/v1/latest.json" --file="$source" --remote
            npx wrangler r2 object get "$HOTSPOT_R2_BUCKET/$prefix/v1/latest.json" --file=".hotspots/verify-$name-latest.json" --remote
            cmp "$source" ".hotspots/verify-$name-latest.json"
            cp "$source" ".hotspots/current-$name.json"
          }
          # Each product follows its own guard decision.
          if [ "$PUBLISH_INHABITED" = "true" ]; then publish .hotspots/snapshot.json inhabited-hotspots inhabited; fi
          if [ "$PUBLISH_GLOBAL_GRID" = "true" ]; then publish .hotspots/global-grid-snapshot.json global-grid-hotspots global-grid; fi

      - name: Alert while a published product has no current snapshot
        if: always() && env.PUBLISH_INTENDED == 'true'
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { snapshotRun } from './scripts/hotspot-publish-guard.mjs';
            const read = (file) => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
            let failed = false;
            for (const kind of ['inhabited', 'global-grid']) {
              const run = snapshotRun(kind, read('.hotspots/current-' + kind + '.json'));
              if (!run || run.validTo <= Date.now()) {
                console.log('::error::No current ' + kind + ' hotspot snapshot is published; pages show the unavailable state.');
                failed = true;
              }
            }
            process.exitCode = failed ? 1 : 0;
          "
