name: GSC credential and encrypted snapshot
run-name: GSC ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only operation
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - encrypted-snapshot

permissions:
  actions: read
  contents: read

concurrency:
  group: gsc-readonly-collection
  cancel-in-progress: false

jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned read-only client
        run: python -m pip install --disable-pip-version-check -r requirements-gsc.txt
      - name: Refuse a second encrypted snapshot on the same UTC day
        if: inputs.operation == 'encrypted-snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Encrypted GSC snapshot reruns are disabled; dispatch on a later UTC day." >&2
            exit 1
          fi
          today=$(date -u +%F)
          runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/gsc-credential-smoke-test.yml/runs?per_page=100")
          if ! jq -e \
            --arg today "$today" \
            --argjson current "$GITHUB_RUN_ID" \
            '[.workflow_runs[] | select(.id != $current and .display_title == "GSC encrypted-snapshot" and (.created_at | startswith($today)))] | length == 0' \
            >/dev/null <<<"$runs"; then
            echo "Encrypted GSC snapshot already attempted today; refusing before Google requests." >&2
            exit 1
          fi
      - name: Verify configured property access without output
        if: inputs.operation == 'smoke'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: python scripts/gsc_tracker.py --smoke-test
      - name: Collect private snapshot
        if: inputs.operation == 'encrypted-snapshot'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: >-
          python scripts/gsc_tracker.py
          --database .private/gsc-snapshot.sqlite3
          --csv .private/gsc-snapshot.csv
      - name: Encrypt snapshot before artifact upload
        if: inputs.operation == 'encrypted-snapshot'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rm -rf .private /tmp/gsc-snapshot.tar.gz; }
          trap cleanup EXIT
          tar -C .private -czf /tmp/gsc-snapshot.tar.gz gsc-snapshot.sqlite3 gsc-snapshot.csv
          openssl cms -encrypt -binary -aes-256-cbc \
            -in /tmp/gsc-snapshot.tar.gz \
            -outform DER \
            -out gsc-snapshot.cms \
            scripts/gsc-snapshot-artifact-recipient.pem
      - name: Upload encrypted snapshot only
        if: inputs.operation == 'encrypted-snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-snapshot-${{ github.run_id }}
          path: gsc-snapshot.cms
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
