name: GSC credential and encrypted snapshot
run-name: GSC ${{ inputs.operation }} shard-${{ inputs.shard }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only operation
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - encrypted-snapshot
      shard:
        description: Deterministic 100-URL shard for encrypted snapshots
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"

permissions:
  actions: read
  contents: read

concurrency:
  group: gsc-readonly-collection
  cancel-in-progress: false

jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned read-only client
        run: python -m pip install --disable-pip-version-check -r requirements-gsc.txt
      - name: Refuse a second encrypted snapshot on the same UTC day
        if: inputs.operation == 'encrypted-snapshot'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Encrypted GSC shard reruns are disabled; dispatch later." >&2
            exit 1
          fi
          today=$(date -u +%F)
          runs=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/gsc-credential-smoke-test.yml/runs?per_page=100")
          if ! jq -e \
            --arg today "$today" \
            --argjson current "$GITHUB_RUN_ID" \
            --arg title "GSC encrypted-snapshot shard-${{ inputs.shard }}" \
            '[.workflow_runs[] | select(.id != $current and (.created_at | startswith($today)))] as $prior
             | ([$prior[] | select(.display_title == $title)] | length == 0)
             and ((reduce $prior[] as $run (0;
               . + (if $run.display_title == "GSC encrypted-snapshot" then 1200
                    elif ($run.display_title | startswith("GSC encrypted-snapshot shard-")) then 300
                    else 0 end))) + 300 <= 2000)' \
            >/dev/null <<<"$runs"; then
            echo "This shard is duplicated or today's conservative URL Inspection allowance is exhausted." >&2
            exit 1
          fi
      - name: Verify configured property access without output
        if: inputs.operation == 'smoke'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: python scripts/gsc_tracker.py --smoke-test
      - name: Collect private snapshot
        if: inputs.operation == 'encrypted-snapshot'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: >-
          python scripts/gsc_tracker.py
          --database .private/gsc-snapshot.sqlite3
          --csv .private/gsc-snapshot.csv
          --shard-count 4
          --shard-index ${{ inputs.shard }}
      - name: Encrypt snapshot before artifact upload
        if: inputs.operation == 'encrypted-snapshot'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rm -rf .private /tmp/gsc-snapshot.tar.gz; }
          trap cleanup EXIT
          tar -C .private -czf /tmp/gsc-snapshot.tar.gz gsc-snapshot.sqlite3 gsc-snapshot.csv
          openssl cms -encrypt -binary -aes-256-cbc \
            -in /tmp/gsc-snapshot.tar.gz \
            -outform DER \
            -out gsc-snapshot.cms \
            scripts/gsc-snapshot-artifact-recipient.pem
      - name: Upload encrypted snapshot only
        if: inputs.operation == 'encrypted-snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-snapshot-shard-${{ inputs.shard }}-${{ github.run_id }}
          path: gsc-snapshot.cms
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
