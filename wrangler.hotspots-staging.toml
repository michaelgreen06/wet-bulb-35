name = "wetbulb35-weather-staging"
main = "workers/hono-page-renderer.mjs"
compatibility_date = "2026-09-08"

# Isolated workers.dev staging candidate only. No production route, DNS, or custom domain.
[assets]
directory = "worker-assets"
binding = "ASSETS"
run_worker_first = true

[durable_objects]
bindings = [{ name = "WEATHER_GATE", class_name = "WeatherGate" }]

[[migrations]]
tag = "v1-weather-gate"
new_sqlite_classes = ["WeatherGate"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true

[vars]
CANONICAL_ORIGIN = "https://www.wetbulb35.com"
GOOGLE_ANALYTICS_ID = "G-LNPWV0JL7S"
WEATHER_FRESH_SECONDS = "300"
WEATHER_STALE_SECONDS = "600"
WEATHER_TIMEOUT_MS = "5000"
WEATHER_DAILY_ATTEMPT_LIMIT = "2000"
FORECAST_FRESH_SECONDS = "10800"
FORECAST_STALE_SECONDS = "43200"
FORECAST_TIMEOUT_MS = "5000"
FORECAST_DAILY_ATTEMPT_LIMIT = "2000"
OPEN_METEO_API_MODE = "public-noncommercial"
HTML_CACHE_EVENT_SAMPLE_RATE = "0"
HOTSPOT_FEATURE_MODE = "enabled"
HOTSPOT_SNAPSHOT_ASSET_PATH = "/hotspot-snapshot.json"
GLOBAL_GRID_HOTSPOT_FEATURE_MODE = "enabled"
GLOBAL_GRID_HOTSPOT_SNAPSHOT_ASSET_PATH = "/global-grid-hotspot-snapshot.json"
